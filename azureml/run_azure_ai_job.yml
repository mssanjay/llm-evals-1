$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
display_name: "cue-eval-foundry"
experiment_name: "cue-following-demo"
description: "Run the simple cue-following demo against a Microsoft Foundry deployment."
code: ..
command: >-
  python scripts/run_experiment.py
  --provider azure-foundry
  --model qwen3-32b
  --output-dir outputs/foundry
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: conda.yml
environment_variables:
  AZURE_AI_ENDPOINT: "https://YOUR-RESOURCE.services.ai.azure.com"
  AZURE_AI_API_KEY: "YOUR-KEY"
compute: azureml:YOUR_COMPUTE_NAME
