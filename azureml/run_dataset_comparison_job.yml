$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
display_name: "experiment-2-live-history-comparison"
experiment_name: "cue-following-demo"
description: "Experiment 2: compare probe shortcut rate by how many teaching turns held the planted rule."
code: ..
command: >-
  python scripts/run_experiment_2.py
  --provider dry-run
  --prepared-dir data
  --story-pool data/story_pool.jsonl
  --limit 100
  --output-dir outputs/azure_experiment_2
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: conda.yml
compute: azureml:YOUR_COMPUTE_NAME
