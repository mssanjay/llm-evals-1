$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
display_name: "experiment-1-multiturn-story-comparison"
experiment_name: "cue-following-demo"
description: "Experiment 1: compare shortcut rate by wrong-answer cue count inside one story."
code: ..
command: >-
  python scripts/run_dataset_comparison.py
  --provider dry-run
  --skip-prepare
  --prepared-dir data
  --limit 100
  --output-dir outputs/azure_experiment_1
environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04
  conda_file: conda.yml
compute: azureml:YOUR_COMPUTE_NAME
